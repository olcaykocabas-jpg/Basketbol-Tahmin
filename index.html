<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketbol Tahmin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#111827}
main{max-width:700px;margin:auto;padding:15px}
.box{background:white;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 3px 15px #0001}
h1{margin:0 0 5px;font-size:28px}
.small{color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#6b7280}
input,button{width:100%;padding:15px;margin-top:7px;border-radius:13px;font-size:16px}
input{border:1px solid #d1d5db}
button{border:0;background:#111827;color:white;font-weight:bold}
.score{text-align:center;font-size:42px;font-weight:800;margin:20px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}
.hide{display:none}
.good{color:#15803d}
.bad{color:#b91c1c}
</style>
</head>

<body>
<main>

<div id="login" class="box">
<h1>🔐 Basketbol Tahmin</h1>
<p class="small">Özel kullanım</p>
<input id="pass" type="password" placeholder="Şifre">
<button onclick="login()">Giriş Yap</button>
<p id="loginMsg" class="bad"></p>
</div>

<div id="app" class="hide">

<div class="box">
<h1>🏀 Basketbol Tahmin</h1>
<p class="small">İnternetten takım verilerini alır ve tahmini skor hesaplar.</p>
</div>

<div class="box">
<div class="grid">
<div>
<label>EV SAHİBİ</label>
<input id="home" value="Melbourne">
</div>
<div>
<label>DEPLASMAN</label>
<input id="away" value="I.Hawks">
</div>
</div>

<button onclick="start()">🌐 VERİLERİ ÇEK VE TAHMİN ET</button>
<p id="status" class="small"></p>
</div>

<div id="result" class="box hide">
<div id="teams" class="small"></div>
<div id="score" class="score"></div>

<div class="row"><span>Ev sahibi kazanma</span><b id="win"></b></div>
<div class="row"><span>Güven</span><b id="confidence"></b></div>
<div class="row"><span>Ev sahibi sayı ort.</span><b id="hpts"></b></div>
<div class="row"><span>Deplasman sayı ort.</span><b id="apts"></b></div>
<div class="row"><span>Ev sahibi yediği</span><b id="hopp"></b></div>
<div class="row"><span>Deplasman yediği</span><b id="aopp"></b></div>
<div class="row"><span>Analiz edilen maç</span><b id="games"></b></div>
</div>

</div>
</main>

<script>
const PASSWORD="Yaclo112";

function login(){
 if(pass.value===PASSWORD){
  loginMsg.textContent="";
  document.getElementById("login").classList.add("hide");
  document.getElementById("app").classList.remove("hide");
 }else{
  loginMsg.textContent="Şifre yanlış.";
 }
}

/*
 Veri kaynağı:
 Jina'nın ücretsiz web geçidi üzerinden SofaScore verisi.
 API anahtarı gerekmez.
*/
async function getJSON(url){
 const targets=[
  "https://r.jina.ai/"+url,
  "https://r.jina.ai/http://"+url.replace(/^https?:\/\//,"")
 ];

 for(const u of targets){
  try{
   const r=await fetch(u,{cache:"no-store"});
   if(!r.ok)continue;
   const text=await r.text();

   try{return JSON.parse(text)}catch(e){}

   const p=text.indexOf("{");
   const q=text.lastIndexOf("}");
   if(p>=0&&q>p){
    try{return JSON.parse(text.slice(p,q+1))}catch(e){}
   }
  }catch(e){}
 }
 throw new Error("İnternet verisine ulaşılamadı.");
}

async function searchTeam(name){
 const url="https://www.sofascore.com/api/v1/search/all?q="+
 encodeURIComponent(name);

 const data=await getJSON(url);
 const arr=data.results||[];

 const teams=arr
  .map(x=>x.entity)
  .filter(x=>x&&x.id&&x.name);

 if(!teams.length)return null;

 const exact=teams.find(x=>
  x.name.toLowerCase()===name.toLowerCase()
 );

 return exact||teams[0];
}

async function getGames(teamId){
 let all=[];

 for(let page=0;page<5;page++){
  try{
   const url=
   "https://www.sofascore.com/api/v1/team/"+
   teamId+"/events/last/"+page;

   const data=await getJSON(url);

   for(const e of (data.events||[])){
    if(e.status &&
       (e.status.type==="finished" ||
        e.status.type==="finishedbyperiods")){

     const h=e.homeScore?.normaltime;
     const a=e.awayScore?.normaltime;

     if(Number.isFinite(h)&&Number.isFinite(a))
       all.push({event:e,home:h,away:a});
    }
   }
  }catch(e){}
 }

 return all.slice(0,10);
}

function average(a){
 if(!a.length)return 0;
 return a.reduce((x,y)=>x+y,0)/a.length;
}

async function teamStats(team){
 const games=await getGames(team.id);

 const scored=[];
 const conceded=[];

 for(const g of games){
  const home=g.event.homeTeam.id===team.id;

  scored.push(home?g.home:g.away);
  conceded.push(home?g.away:g.home);
 }

 return {
  name:team.name,
  games:games.length,
  scored:average(scored),
  conceded:average(conceded)
 };
}

async function start(){
 const hname=home.value.trim();
 const aname=away.value.trim();

 if(!hname||!aname){
  status.textContent="İki takım adını da yaz.";
  return;
 }

 result.classList.add("hide");
 status.textContent="🔎 Takımlar aranıyor...";

 try{
  const ht=await searchTeam(hname);
  const at=await searchTeam(aname);

  if(!ht)throw new Error("Ev sahibi takım bulunamadı.");
  if(!at)throw new Error("Deplasman takımı bulunamadı.");

  status.textContent="📊 Son maçlar internetten alınıyor...";

  const H=await teamStats(ht);
  const A=await teamStats(at);

  if(H.games<2||A.games<2)
   throw new Error(
    "Bu takımlar için yeterli maç verisi bulunamadı."
   );

  /*
   Basit tahmin modeli:
   Hücum gücü + rakibin savunma ortalaması.
   Ev sahibi avantajı ayrıca eklenir.
  */

  let homeScore=
   (H.scored*0.60+A.conceded*0.40)+2.5;

  let awayScore=
   (A.scored*0.60+H.conceded*0.40);

  homeScore=Math.max(40,homeScore);
  awayScore=Math.max(40,awayScore);

  const difference=homeScore-awayScore;

  let probability=
   50+difference*2.1;

  probability=Math.max(5,Math.min(95,probability));

  let confidence=
   55+Math.min(H.games,A.games)*3+
   Math.min(15,Math.abs(difference));

  confidence=Math.min(95,Math.round(confidence));

  teams.textContent=H.name+"  —  "+A.name;

  score.textContent=
   Math.round(homeScore)+"  -  "+Math.round(awayScore);

  win.textContent=Math.round(probability)+"%";

  confidence.textContent=
   confidence>=80?"Yüksek":
   confidence>=65?"Orta":"Düşük";

  hpts.textContent=H.scored.toFixed(1);
  apts.textContent=A.scored.toFixed(1);
  hopp.textContent=H.conceded.toFixed(1);
  aopp.textContent=A.conceded.toFixed(1);

  games.textContent=
   H.games+" + "+A.games;

  result.classList.remove("hide");

  status.innerHTML=
   '<span class="good">✓ İnternetten veri alındı.</span>';

 }catch(e){
  status.innerHTML=
   '<span class="bad">⚠ '+e.message+'</span>';
 }
}
</script>
</body>
</html>
