<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketbol Tahmin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.box{
  background:#fff;
  border-radius:22px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 4px 18px #00000012;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

h2{
  margin:0 0 12px;
}

.small{
  color:#6b7280;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-size:12px;
  color:#6b7280;
  margin-bottom:5px;
  font-weight:700;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#111827;
  color:#fff;
  font-size:16px;
  font-weight:800;
  margin-top:14px;
}

button:disabled{
  opacity:.55;
}

.score{
  font-size:42px;
  font-weight:900;
  text-align:center;
  margin:18px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.row:last-child{
  border-bottom:0;
}

.good{
  color:#15803d;
}

.bad{
  color:#b91c1c;
}

.loading{
  padding:10px 0;
}

.hide{
  display:none;
}

.note{
  color:#6b7280;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:500px){

  .grid{
    grid-template-columns:1fr;
  }

  .score{
    font-size:36px;
  }

}

</style>
</head>

<body>

<main>

<div class="box">
  <h1>🏀 Basketbol Tahmin</h1>
  <div class="small">
    Güncel internet verileriyle son maç performansına göre tahmin yapar.
  </div>
</div>

<div class="box">

  <div class="grid">

    <div>
      <label>EV SAHİBİ</label>
      <input
        id="home"
        value="Melbourne United"
        autocomplete="off">
    </div>

    <div>
      <label>DEPLASMAN</label>
      <input
        id="away"
        value="Illawarra Hawks"
        autocomplete="off">
    </div>

  </div>

  <button id="predictBtn">
    🌐 VERİLERİ ÇEK VE TAHMİN ET
  </button>

  <div id="status" class="small"></div>

</div>

<div id="result" class="box hide">

  <h2>📊 Tahmin Sonucu</h2>

  <div id="teams" class="small"></div>

  <div id="score" class="score"></div>

  <div class="row">
    <span>Ev sahibi kazanma</span>
    <b id="homeWin"></b>
  </div>

  <div class="row">
    <span>Deplasman kazanma</span>
    <b id="awayWin"></b>
  </div>

  <div class="row">
    <span>Toplam sayı</span>
    <b id="total"></b>
  </div>

  <div class="row">
    <span>Güven</span>
    <b id="confidence"></b>
  </div>

  <div class="row">
    <span>Ev sahibi son maç ort.</span>
    <b id="homeScored"></b>
  </div>

  <div class="row">
    <span>Ev sahibi yediği</span>
    <b id="homeConceded"></b>
  </div>

  <div class="row">
    <span>Deplasman son maç ort.</span>
    <b id="awayScored"></b>
  </div>

  <div class="row">
    <span>Deplasman yediği</span>
    <b id="awayConceded"></b>
  </div>

  <div class="row">
    <span>Analiz edilen maç</span>
    <b id="games"></b>
  </div>

  <p id="details" class="note"></p>

</div>

</main>

<script>

"use strict";

/* =====================================================
   TEMEL YARDIMCILAR
===================================================== */

const $ = id => document.getElementById(id);

const ALIASES = [

  {
    keys:["melbourne","melbourne united"],
    name:"Melbourne United"
  },

  {
    keys:["i.hawks","ihawks","illawarra","illawarra hawks"],
    name:"Illawarra Hawks"
  },

  {
    keys:["sydney","sydney kings"],
    name:"Sydney Kings"
  },

  {
    keys:["brisbane","brisbane bullets"],
    name:"Brisbane Bullets"
  },

  {
    keys:["perth","perth wildcats"],
    name:"Perth Wildcats"
  },

  {
    keys:["adelaide","adelaide 36ers"],
    name:"Adelaide 36ers"
  },

  {
    keys:["new zealand","new zealand breakers"],
    name:"New Zealand Breakers"
  },

  {
    keys:["cairns","cairns taipans"],
    name:"Cairns Taipans"
  },

  {
    keys:["tasmania","tasmania jackjumpers"],
    name:"Tasmania JackJumpers"
  },

  {
    keys:[
      "south east melbourne",
      "se melbourne",
      "sem"
    ],
    name:"South East Melbourne Phoenix"
  }

];

function norm(value){

  return String(value || "")
    .toLocaleLowerCase("tr-TR")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.'’_-]/g," ")
    .replace(/\s+/g," ")
    .trim();

}

function aliasName(name){

  const n = norm(name);

  const found = ALIASES.find(a =>
    a.keys.some(k => norm(k) === n)
  );

  return found ? found.name : name.trim();

}

function average(values){

  if(!values.length) return 0;

  return values.reduce(
    (sum,value)=>sum+value,
    0
  ) / values.length;

}

function weightedAverage(values){

  if(!values.length) return 0;

  let total = 0;
  let weightTotal = 0;

  for(let i=0;i<values.length;i++){

    /*
      En yeni maça daha yüksek ağırlık.
      İlk sıradaki maç en yeni maçtır.
    */

    const weight =
      Math.max(1,values.length-i);

    total += values[i] * weight;
    weightTotal += weight;

  }

  return total / weightTotal;

}

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}

/* =====================================================
   INTERNET / JSON
===================================================== */

async function getText(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          signal:controller.signal,
          headers:{
            "Accept":
              "application/json,text/plain,*/*"
          }
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    return await response.text();

  }finally{

    clearTimeout(timer);

  }

}

function parseJSON(text){

  try{

    return JSON.parse(text);

  }catch(e){}

  const first =
    text.indexOf("{");

  const last =
    text.lastIndexOf("}");

  if(first >= 0 && last > first){

    try{

      return JSON.parse(
        text.slice(first,last+1)
      );

    }catch(e){}

  }

  throw new Error(
    "Sunucudan geçerli JSON alınamadı."
  );

}

async function getJSON(url){

  return parseJSON(
    await getText(url)
  );

}

/* =====================================================
   TAKIM ARAMA
===================================================== */

async function searchTeam(userName){

  const requested =
    aliasName(userName);

  const urls = [

    "https://www.sofascore.com/api/v1/search/all?q=" +
      encodeURIComponent(requested),

    "https://www.sofascore.com/api/v1/search/all?q=" +
      encodeURIComponent(userName)

  ];

  let all = [];

  for(const url of urls){

    try{

      const data =
        await getJSON(url);

      if(Array.isArray(data.results)){

        all.push(...data.results);

      }

    }catch(e){}

  }

  const entities =
    all
      .map(x=>x && x.entity)
      .filter(Boolean);

  const teams =
    entities.filter(x =>

      x.id &&
      x.name &&
      (
        !x.sport ||
        x.sport.slug === "basketball" ||
        x.sport.name === "Basketball"
      )

  );

  if(!teams.length){

    return null;

  }

  const wanted =
    norm(requested);

  const exact =
    teams.find(
      t=>norm(t.name) === wanted
    );

  if(exact){

    return exact;

  }

  const contains =
    teams.find(t=>{

      const n = norm(t.name);

      return (
        n.includes(wanted) ||
        wanted.includes(n)
      );

    });

  if(contains){

    return contains;

  }

  const words =
    wanted
      .split(" ")
      .filter(w=>w.length >= 3);

  let best = null;
  let bestScore = -1;

  for(const team of teams){

    const n =
      norm(team.name);

    let score = 0;

    for(const word of words){

      if(n.includes(word)){

        score++;

      }

    }

    if(score > bestScore){

      bestScore = score;
      best = team;

    }

  }

  return best || teams[0];

}

/* =====================================================
   SON MAÇLARI GETİR
===================================================== */

function numericScore(score){

  if(!score) return null;

  const values = [

    score.normaltime,
    score.current,
    score.display

  ];

  for(const value of values){

    if(
      typeof value === "number" &&
      Number.isFinite(value)
    ){

      return value;

    }

  }

  return null;

}

async function getGames(teamId){

  const pages = [
    0,
    1,
    2
  ];

  const all = [];

  for(const page of pages){

    try{

      const url =
        "https://www.sofascore.com/api/v1/team/" +
        teamId +
        "/events/last/" +
        page;

      const data =
        await getJSON(url);

      const events =
        Array.isArray(data.events)
          ? data.events
          : [];

      for(const event of events){

        if(
          !event ||
          !event.homeTeam ||
          !event.awayTeam
        ){

          continue;

        }

        const finished =
          event.status &&
          (
            event.status.type === "finished" ||
            event.status.type === "finishedbyperiods"
          );

        if(!finished){

          continue;

        }

        const homeScore =
          numericScore(event.homeScore);

        const awayScore =
          numericScore(event.awayScore);

        if(
          homeScore === null ||
          awayScore === null
        ){

          continue;

        }

        all.push({

          id:event.id,

          event:event,

          home:homeScore,

          away:awayScore,

          timestamp:
            event.startTimestamp || 0

        });

      }

    }catch(e){}

  }

  const unique = [];
  const seen = new Set();

  for(const game of all){

    if(seen.has(game.id)){

      continue;

    }

    seen.add(game.id);

    unique.push(game);

  }

  unique.sort(
    (a,b)=>b.timestamp-a.timestamp
  );

  return unique.slice(0,10);

}

/* =====================================================
   TAKIM İSTATİSTİĞİ
===================================================== */

async function teamStats(team){

  const games =
    await getGames(team.id);

  const overallScored = [];
  const overallConceded = [];

  const homeScored = [];
  const homeConceded = [];

  const awayScored = [];
  const awayConceded = [];

  for(const game of games){

    const homeId =
      Number(game.event.homeTeam.id);

    const teamId =
      Number(team.id);

    const isHome =
      homeId === teamId;

    const scored =
      isHome
        ? game.home
        : game.away;

    const conceded =
      isHome
        ? game.away
        : game.home;

    overallScored.push(scored);
    overallConceded.push(conceded);

    if(isHome){

      homeScored.push(scored);
      homeConceded.push(conceded);

    }else{

      awayScored.push(scored);
      awayConceded.push(conceded);

    }

  }

  /*
    Son maçlar ağırlıklı ortalama.
  */

  const scored =
    weightedAverage(overallScored);

  const conceded =
    weightedAverage(overallConceded);

  const venueScored =
    weightedAverage(
      homeScored.length >= 2
        ? homeScored
        : overallScored
    );

  const venueConceded =
    weightedAverage(
      homeConceded.length >= 2
        ? homeConceded
        : overallConceded
    );

  const awayVenueScored =
    weightedAverage(
      awayScored.length >= 2
        ? awayScored
        : overallScored
    );

  const awayVenueConceded =
    weightedAverage(
      awayConceded.length >= 2
        ? awayConceded
        : overallConceded
    );

  /*
    Son 5 maç.
  */

  const recent5 =
    games.slice(0,5);

  const recentScored = [];
  const recentConceded = [];

  for(const game of recent5){

    const homeId =
      Number(game.event.homeTeam.id);

    if(homeId === Number(team.id)){

      recentScored.push(game.home);
      recentConceded.push(game.away);

    }else{

      recentScored.push(game.away);
      recentConceded.push(game.home);

    }

  }

  return {

    id:team.id,

    name:team.name,

    games:games.length,

    scored:scored,

    conceded:conceded,

    homeScored:venueScored,

    homeConceded:venueConceded,

    awayScored:awayVenueScored,

    awayConceded:awayVenueConceded,

    recentScored:
      weightedAverage(recentScored),

    recentConceded:
      weightedAverage(recentConceded)

  };

}

/* =====================================================
   TAHMİN MOTORU
===================================================== */

function calculatePrediction(H,A){

  /*
    EV TAKIMI

    Kendi evindeki hücum
    + rakibin deplasmanda yediği
    + genel hücum
    + son form
  */

  const homeBase =

    H.homeScored * 0.38 +

    A.awayConceded * 0.27 +

    H.scored * 0.20 +

    H.recentScored * 0.15;


  /*
    DEPLASMAN TAKIMI

    Kendi deplasman hücumu
    + ev sahibinin evde yediği
    + genel hücum
    + son form
  */

  const awayBase =

    A.awayScored * 0.38 +

    H.homeConceded * 0.27 +

    A.scored * 0.20 +

    A.recentScored * 0.15;


  /*
    Savunma düzeltmesi.

    İyi savunma rakibin beklenen skorunu
    aşağı çeker.
  */

  const homeDefenseFactor =
    clamp(
      1 +
      (72 - A.awayConceded) / 500,
      0.92,
      1.08
    );

  const awayDefenseFactor =
    clamp(
      1 +
      (72 - H.homeConceded) / 500,
      0.92,
      1.08
    );


  let homeScore =
    homeBase *
    homeDefenseFactor;


  let awayScore =
    awayBase *
    awayDefenseFactor;


  /*
    EV SAHİBİ AVANTAJI

    Sabit 2.5 yerine daha kontrollü
    2.0 sayı kullanıyoruz.
  */

  homeScore += 2.0;


  /*
    FORM FARKI

    Son 5 maçta belirgin fark varsa
    küçük düzeltme yap.
  */

  const homeFormDiff =
    H.recentScored -
    H.recentConceded;

  const awayFormDiff =
    A.recentScored -
    A.recentConceded;


  homeScore +=
    clamp(
      homeFormDiff * 0.08,
      -2.5,
      2.5
    );


  awayScore +=
    clamp(
      awayFormDiff * 0.08,
      -2.5,
      2.5
    );


  /*
    Mantıklı basketbol skor aralığı.
  */

  homeScore =
    clamp(homeScore,65,145);

  awayScore =
    clamp(awayScore,65,145);


  /*
    Aşırı uç farkları yumuşat.

    Ama takımların gerçekten güçlü/zayıf
    olduğu durumlarda farkı tamamen silme.
  */

  const difference =
    homeScore - awayScore;


  /*
    Kazanma olasılığı.

    Fark 0 olduğunda yaklaşık %50.
    Fark büyüdükçe favorinin yüzdesi artar.
  */

  let homeProbability =
    50 +
    difference * 2.7;


  homeProbability =
    clamp(
      homeProbability,
      5,
      95
    );


  const awayProbability =
    100 - homeProbability;


  /*
    VERİ GÜVENİ

    Daha fazla maç + daha tutarlı veriler
    daha yüksek güven verir.
  */

  const sample =
    Math.min(
      H.games,
      A.games
    );


  const consistencyHome =
    Math.abs(
      H.scored -
      H.recentScored
    );


  const consistencyAway =
    Math.abs(
      A.scored -
      A.recentScored
    );


  const instability =
    (
      consistencyHome +
      consistencyAway
    ) / 2;


  let confidence =
    58 +

    Math.min(
      sample * 2,
      18
    ) +

    Math.min(
      Math.abs(difference) * 1.2,
      15
    ) -

    Math.min(
      instability * 0.5,
      10
    );


  confidence =
    clamp(
      confidence,
      50,
      93
    );


  return {

    homeScore,

    awayScore,

    total:
      homeScore + awayScore,

    difference,

    homeProbability,

    awayProbability,

    confidence

  };

}

/* =====================================================
   EKRANA YAZ
===================================================== */

function showPrediction(H,A,p){

  $("teams").textContent =
    H.name +
    " — " +
    A.name;


  $("score").textContent =
    Math.round(p.homeScore) +
    "  -  " +
    Math.round(p.awayScore);


  $("homeWin").textContent =
    Math.round(p.homeProbability) +
    "%";


  $("awayWin").textContent =
    Math.round(p.awayProbability) +
    "%";


  $("total").textContent =
    Math.round(p.total);


  const confidence =
    Math.round(p.confidence);


  $("confidence").textContent =
    confidence + "%";


  if(confidence >= 80){

    $("confidence").className =
      "good";

  }else if(confidence < 65){

    $("confidence").className =
      "bad";

  }else{

    $("confidence").className = "";

  }


  $("homeScored").textContent =
    H.scored.toFixed(1);


  $("homeConceded").textContent =
    H.conceded.toFixed(1);


  $("awayScored").textContent =
    A.scored.toFixed(1);


  $("awayConceded").textContent =
    A.conceded.toFixed(1);


  $("games").textContent =
    H.games +
    " + " +
    A.games;


  $("details").textContent =

    "Ev takımının ev hücum ortalaması: " +
    H.homeScored.toFixed(1) +

    " | Evde yediği: " +
    H.homeConceded.toFixed(1) +

    " | Deplasman takımının deplasman hücum ortalaması: " +
    A.awayScored.toFixed(1) +

    " | Deplasmanda yediği: " +
    A.awayConceded.toFixed(1) +

    ". Son maçlara daha yüksek ağırlık verilmiştir.";


  $("result").classList.remove("hide");

}

/* =====================================================
   ANA ÇALIŞTIRMA
===================================================== */

async function start(){

  const homeInput =
    $("home").value.trim();

  const awayInput =
    $("away").value.trim();


  if(!homeInput || !awayInput){

    $("status").innerHTML =
      '<span class="bad">⚠ İki takım adını da yaz.</span>';

    return;

  }


  const button =
    $("predictBtn");


  button.disabled = true;

  $("result")
    .classList
    .add("hide");


  try{

    $("status").innerHTML =
      "🔎 Ev sahibi takım aranıyor...";


    const homeTeam =
      await searchTeam(homeInput);


    if(!homeTeam){

      throw new Error(
        "Ev sahibi takım bulunamadı."
      );

    }


    $("status").innerHTML =
      "🏀 " +
      homeTeam.name +
      "<br>🔎 Deplasman takımı aranıyor...";


    const awayTeam =
      await searchTeam(awayInput);


    if(!awayTeam){

      throw new Error(
        "Deplasman takımı bulunamadı."
      );

    }


    /*
      Kullanıcının yazdığı isimlerin
      gerçekten hangi takımlara eşleştiğini göster.
    */

    $("status").innerHTML =
      "🏀 " +
      homeTeam.name +

      "<br>✈️ " +
      awayTeam.name +

      "<br>📊 Son maçlar alınıyor...";


    const results =
      await Promise.all([

        teamStats(homeTeam),

        teamStats(awayTeam)

      ]);


    const H = results[0];

    const A = results[1];


    if(H.games < 3){

      throw new Error(
        H.name +
        " için yeterli geçmiş maç verisi alınamadı."
      );

    }


    if(A.games < 3){

      throw new Error(
        A.name +
        " için yeterli geçmiş maç verisi alınamadı."
      );

    }


    $("status").innerHTML =
      "🧮 Takım performansları hesaplanıyor...";


    const prediction =
      calculatePrediction(H,A);


    showPrediction(
      H,
      A,
      prediction
    );


    $("status").innerHTML =
      '<span class="good">✅ Analiz tamamlandı.</span>';


  }catch(error){

    $("status").innerHTML =
      '<span class="bad">⚠ ' +
      escapeHTML(
        error.message ||
        "Bir hata oluştu."
      ) +
      '</span>';

  }finally{

    button.disabled = false;

  }

}

/* =====================================================
   HTML GÜVENLİK
===================================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
   BUTON
===================================================== */

$("predictBtn")
  .addEventListener(
    "click",
    start
  );

</script>

</body>
</html>
