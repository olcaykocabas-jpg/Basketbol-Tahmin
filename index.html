<!doctype html>

<head>
<meta charset="utf-8">

<title>🏀 Basketbol Tahmin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#111827;
}

main{

}

.box{

}

}

.small{

}

.grid{

}

label{

}

input{

}

.score{

}

.row{
  display:flex;
  justify-content:space-between;

  padding:13px 0;
  border-bottom:1px solid #eee;
}

.row b{
  text-align:right;
}

}

}

  padding:12px 0;
}

}

.note{

  color:#6b7280;
  line-height:1.5;
}

.stat-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:8px;
}

@media(max-width:560px){
  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<main>

<div id="login" class="box">

<h1>🔐 Basketbol Tahmin</h1>

<p class="small">
Özel kullanım
</p>

<input
  id="pass"
  type="password"
  placeholder="Şifre"
  autocomplete="off"
>

<button id="loginBtn">
Giriş Yap
</button>

<p id="loginMsg" class="bad"></p>

</div>


<div id="app" class="hide">

<div class="box">

<h1>🏀 Basketbol Tahmin</h1>

<p class="small">
Güncel internet verileriyle son maç performansına göre tahmini skor hesaplar.
</p>

</div>


<div class="box">

<div class="grid">

<div>

<label>EV SAHİBİ</label>

<input
 id="home"
 value="Melbourne United"
 autocomplete="off"
>

</div>


<div>

<label>DEPLASMAN</label>

<input
 id="away"
 value="Illawarra Hawks"
 autocomplete="off"
>

</div>

</div>


<button id="predictBtn">
🌐 VERİLERİ ÇEK VE TAHMİN ET
</button>

<p id="status" class="small"></p>

</div>


<div id="result" class="box hide">

<div id="teams" class="small"></div>

<div id="score" class="score"></div>

<div class="row">
<span>Ev sahibi kazanma</span>
<b id="win"></b>
</div>

<div class="row">
<span>Güven</span>
<b id="confidence"></b>
</div>

<div class="row">
<span>Ev sahibi sayı ort.</span>
<b id="hpts"></b>
</div>

<div class="row">
<span>Deplasman sayı ort.</span>
<b id="apts"></b>
</div>

<div class="row">
<span>Ev sahibi yediği</span>
<b id="hopp"></b>
</div>

<div class="row">
<span>Deplasman yediği</span>
<b id="aopp"></b>
</div>

<div class="row">
<span>Analiz edilen maç</span>
<b id="games"></b>
</div>

<p id="source" class="note"></p>

</div>

</div>

</main>


<script>

"use strict";


/* =========================================================
   AYARLAR
========================================================= */

const PASSWORD = "Yaclo112";

const API =
  "https://www.sofascore.com/api/v1";


/* =========================================================
   KISA TAKIM ADLARI
========================================================= */

const ALIASES = [

  {
    keys:[
      "melbourne",
      "melbourne united"
    ],
    name:"Melbourne United"
  },

  {
    keys:[
      "i.hawks",
      "ihawks",
      "illawarra",
      "illawarra hawks",
      "illawarra hawks basketball"
    ],
    name:"Illawarra Hawks"
  },

  {
    keys:[
      "sydney",
      "sydney kings"
    ],
    name:"Sydney Kings"
  },

  {
    keys:[
      "brisbane",
      "brisbane bullets"
    ],
    name:"Brisbane Bullets"
  },

  {
    keys:[
      "perth",
      "perth wildcats"
    ],
    name:"Perth Wildcats"
  },

  {
    keys:[
      "adelaide",
      "adelaide 36ers"
    ],
    name:"Adelaide 36ers"
  },

  {
    keys:[
      "new zealand",
      "new zealand breakers"
    ],
    name:"New Zealand Breakers"
  },

  {
    keys:[
      "cairns",
      "cairns taipans"
    ],
    name:"Cairns Taipans"
  },

  {
    keys:[
      "tasmania",
      "tasmania jackjumpers"
    ],
    name:"Tasmania JackJumpers"
  },

  {
    keys:[
      "south east melbourne",
      "se melbourne",
      "sem"
    ],
    name:"South East Melbourne Phoenix"
  }

];


/* =========================================================
   YARDIMCI
========================================================= */

const $ = id =>
  document.getElementById(id);


function norm(s){

  return String(s || "")
    .toLocaleLowerCase("tr-TR")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.'’_-]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function aliasName(name){

  const n = norm(name);

  const found =
    ALIASES.find(a =>
      a.keys.some(k =>
        norm(k) === n
      )
    );

  return found
    ? found.name
    : name.trim();

}


/* =========================================================
   JSON OKUMA
========================================================= */

function parseJSON(text){

  try{
    return JSON.parse(text);
  }
  catch(e){}

  const first =
    text.indexOf("{");

  const last =
    text.lastIndexOf("}");

  if(first >= 0 && last > first){

    try{
      return JSON.parse(
        text.slice(first,last + 1)
      );
    }
    catch(e){}

  }

  throw new Error(
    "Sunucudan geçerli JSON alınamadı."
  );

}


/* =========================================================
   İNTERNET İSTEĞİ
   Önce SofaScore.
   Çalışmazsa Jina geçidi.
========================================================= */

async function getJSON(url){

  const targets = [

    url,

    "https://r.jina.ai/" + url

  ];


  let lastError = null;


  for(const target of targets){

    const controller =
      new AbortController();

    const timer =
      setTimeout(
        () => controller.abort(),
        15000
      );


    try{

      const response =
        await fetch(
          target,
          {
            method:"GET",
            cache:"no-store",
            signal:controller.signal,
            headers:{
              "Accept":
              "application/json,text/plain,*/*"
            }
          }
        );


      clearTimeout(timer);


      if(!response.ok){

        throw new Error(
          "HTTP " + response.status
        );

      }


      const text =
        await response.text();


      if(!text.trim()){

        throw new Error(
          "Boş cevap"
        );

      }


      return parseJSON(text);

    }
    catch(error){

      clearTimeout(timer);

      lastError = error;

    }

  }


  throw lastError ||
    new Error("İnternet bağlantısı kurulamadı.");

}


/* =========================================================
   TAKIM ARAMA
========================================================= */

async function searchTeam(userName){

  const requested =
    aliasName(userName);

  const queries = [

    requested,

    userName.trim()

  ];


  let all = [];


  for(const qText of queries){

    try{

      const url =
        API +
        "/search/all?q=" +
        encodeURIComponent(qText);

      const data =
        await getJSON(url);


      if(
        Array.isArray(data.results)
      ){

        all.push(
          ...data.results
        );

      }

    }
    catch(e){

      console.log(
        "Takım arama başarısız:",
        qText,
        e
      );

    }

  }


  const entities =
    all
      .map(x =>
        x && x.entity
      )
      .filter(Boolean);


  const teams =
    entities.filter(x =>

      x.id &&
      x.name &&
      (
        !x.sport ||
        x.sport.slug === "basketball" ||
        x.sport.name === "Basketball"
      )

    );


  if(!teams.length){

    return null;

  }


  const wanted =
    norm(requested);


  /* Tam eşleşme */

  const exact =
    teams.find(
      t =>
      norm(t.name) === wanted
    );


  if(exact){

    return exact;

  }


  /* İçeriyor */

  const contains =
    teams.find(t => {

      const n =
        norm(t.name);

      return (
        n.includes(wanted) ||
        wanted.includes(n)
      );

    });


  if(contains){

    return contains;

  }


  /* Kelime eşleşmesi */

  const words =
    wanted
      .split(" ")
      .filter(w => w.length >= 3);


  let best = null;

  let bestScore = -1;


  for(const t of teams){

    const n =
      norm(t.name);

    let score = 0;


    for(const word of words){

      if(n.includes(word)){

        score++;

      }

    }


    if(score > bestScore){

      bestScore = score;

      best = t;

    }

  }


  return best || teams[0];

}


/* =========================================================
   SKOR
========================================================= */

function numericScore(score){

  if(!score){

    return null;

  }


  const values = [

    score.normaltime,

    score.current,

    score.display

  ];


  for(const value of values){

    if(
      typeof value === "number" &&
      Number.isFinite(value)
    ){

      return value;

    }

  }


  return null;

}


/* =========================================================
   SON MAÇLAR
========================================================= */

async function getGames(teamId){

  const games = [];

  const seen = new Set();


  /*
    0-5 = yaklaşık son 60 maçlık alan.
    Sadece bitmiş maçlar alınır.
  */

  for(
    let page = 0;
    page < 6;
    page++
  ){

    const url =
      API +
      "/team/" +
      encodeURIComponent(teamId) +
      "/events/last/" +
      page;


    try{

      const data =
        await getJSON(url);


      const events =
        Array.isArray(data.events)
          ? data.events
          : [];


      for(const event of events){

        if(
          !event ||
          !event.homeTeam ||
          !event.awayTeam
        ){

          continue;

        }


        const finished =

          event.status &&
          (
            event.status.type ===
            "finished" ||

            event.status.type ===
            "finishedbyperiods"
          );


        if(!finished){

          continue;

        }


        const homeScore =
          numericScore(
            event.homeScore
          );

        const awayScore =
          numericScore(
            event.awayScore
          );


        if(
          homeScore === null ||
          awayScore === null
        ){

          continue;

        }


        if(seen.has(event.id)){

          continue;

        }


        seen.add(event.id);


        games.push({

          id:event.id,

          event:event,

          home:homeScore,

          away:awayScore

        });

      }

    }
    catch(error){

      console.log(
        "Maç sayfası okunamadı:",
        page,
        error
      );

    }

  }


  /*
    Tarihe göre yeniden eskiye.
  */

  games.sort(
    (a,b) =>
      (b.event.startTimestamp || 0) -
      (a.event.startTimestamp || 0)
  );


  return games.slice(0,10);

}


/* =========================================================
   ORTALAMA
========================================================= */

function average(values){

  if(!values.length){

    return 0;

  }


  return (
    values.reduce(
      (a,b) => a + b,
      0
    ) /
    values.length
  );

}


/* =========================================================
   TAKIM İSTATİSTİĞİ
========================================================= */

async function teamStats(team){

  const games =
    await getGames(team.id);


  const scored = [];

  const conceded = [];


  for(const game of games){

    const homeId =
      Number(
        game.event.homeTeam.id
      );

    const teamId =
      Number(team.id);


    if(homeId === teamId){

      scored.push(
        game.home
      );

      conceded.push(
        game.away
      );

    }
    else{

      scored.push(
        game.away
      );

      conceded.push(
        game.home
      );

    }

  }


  return {

    id:team.id,

    name:team.name,

    games:games.length,

    scored:
      average(scored),

    conceded:
      average(conceded)

  };

}


/* =========================================================
   TAHMİN MODELİ
========================================================= */

function calculatePrediction(H,A){

  /*
    Ev sahibi hücumu:
    %55 kendi sayı ortalaması
    %45 rakibin yediği

    Deplasman:
    %55 kendi sayı ortalaması
    %45 ev sahibinin yediği
  */

  let homeScore =
    H.scored * 0.55 +
    A.conceded * 0.45;


  let awayScore =
    A.scored * 0.55 +
    H.conceded * 0.45;


  /*
    Ev sahibi avantajı.
  */

  homeScore += 2.5;


  /*
    Aşırı uçları biraz dengeler.
  */

  homeScore =
    Math.max(
      60,
      Math.min(
        140,
        homeScore
      )
    );


  awayScore =
    Math.max(
      60,
      Math.min(
        140,
        awayScore
      )
    );


  const diff =
    homeScore - awayScore;


  /*
    Kazanma olasılığı.
  */

  let homeWin =
    50 + diff * 2.2;


  homeWin =
    Math.max(
      5,
      Math.min(
        95,
        homeWin
      )
    );


  /*
    Veri miktarına göre güven.
  */

  const games =
    Math.min(
      H.games,
      A.games
    );


  let confidence =
    50 +
    Math.min(
      25,
      games * 2.5
    );


  /*
    İki takım arasındaki farkın büyüklüğü
    güveni bir miktar artırır.
  */

  confidence +=
    Math.min(
      15,
      Math.abs(diff) * 0.8
    );


  confidence =
    Math.max(
      50,
      Math.min(
        90,
        confidence
      )
    );


  return {

    home:
      Math.round(homeScore),

    away:
      Math.round(awayScore),

    homeWin:
      Math.round(homeWin),

    confidence:
      Math.round(confidence)

  };

}


/* =========================================================
   GİRİŞ
========================================================= */

function login(){

  if(
    $("pass").value ===
    PASSWORD
  ){

    $("login")
      .classList
      .add("hide");


    $("app")
      .classList
      .remove("hide");


    $("loginMsg")
      .textContent = "";

  }
  else{

    $("loginMsg")
      .textContent =
      "Şifre yanlış.";

  }

}


/* =========================================================
   TAHMİNİ BAŞLAT
========================================================= */

async function start(){

  const homeName =
    $("home").value.trim();

  const awayName =
    $("away").value.trim();


  if(
    !homeName ||
    !awayName
  ){

    $("status").innerHTML =
      '<span class="bad">⚠ İki takım adını da yaz.</span>';

    return;

  }


  $("predictBtn").disabled =
    true;


  $("result")
    .classList
    .add("hide");


  $("status").innerHTML =
    '<div class="loading">🔎 Takımlar aranıyor...</div>';


  try{

    /*
      EV SAHİBİ
    */

    const homeTeam =
      await searchTeam(
        homeName
      );


    if(!homeTeam){

      throw new Error(
        "Ev sahibi bulunamadı. İnternet veri kaynağına erişilemiyor veya takım adı bulunamadı."
      );

    }


    $("status").innerHTML =
      "🏀 Ev sahibi: <b>" +
      homeTeam.name +
      "</b><br>" +
      "🔎 Deplasman aranıyor...";


    /*
      DEPLASMAN
    */

    const awayTeam =
      await searchTeam(
        awayName
      );


    if(!awayTeam){

      throw new Error(
        "Deplasman takımı bulunamadı."
      );

    }


    $("status").innerHTML =
      "🏀 " +
      homeTeam.name +
      "<br>" +
      "🏀 " +
      awayTeam.name +
      "<br>" +
      "📊 Son maçlar internetten alınıyor...";


    /*
      İKİ TAKIMIN VERİLERİ
    */

    const [
      H,
      A
    ] =
      await Promise.all([

        teamStats(homeTeam),

        teamStats(awayTeam)

      ]);


    if(H.games < 2){

      throw new Error(
        H.name +
        " için yeterli son maç verisi alınamadı."
      );

    }


    if(A.games < 2){

      throw new Error(
        A.name +
        " için yeterli son maç verisi alınamadı."
      );

    }


    /*
      TAHMİN
    */

    const prediction =
      calculatePrediction(
        H,
        A
      );


    /*
      SONUÇ
    */

    $("teams").innerHTML =
      "<b>" +
      H.name +
      "</b> vs <b>" +
      A.name +
      "</b>";


    $("score").textContent =
      prediction.home +
      " - " +
      prediction.away;


    $("win").textContent =
      "%" +
      prediction.homeWin;


    $("confidence").textContent =
      "%" +
      prediction.confidence;


    $("hpts").textContent =
      H.scored.toFixed(1);


    $("apts").textContent =
      A.scored.toFixed(1);


    $("hopp").textContent =
      H.conceded.toFixed(1);


    $("aopp").textContent =
      A.conceded.toFixed(1);


    $("games").textContent =
      H.games +
      " / " +
      A.games;


    $("source").textContent =
      "Kaynak: SofaScore kamuya açık maç verileri. " +
      "Tahmin; son maç sayı ortalamaları, rakibin yediği sayılar ve ev sahibi avantajı kullanılarak hesaplanmıştır.";


    $("result")
      .classList
      .remove("hide");


    $("status").innerHTML =
      '<span class="good">✅ Veriler alındı ve tahmin oluşturuldu.</span>';


  }
  catch(error){

    console.error(error);


    $("status").innerHTML =
      '<span class="bad">⚠ ' +
      (
        error.message ||
        "Veri alınırken hata oluştu."
      ) +
      '</span>';

  }
  finally{

    $("predictBtn").disabled =
      false;

  }

}


/* =========================================================
   BUTONLAR
========================================================= */

$("loginBtn")
  .addEventListener(
    "click",
    login
  );


$("pass")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        login();

      }

    }
  );


$("predictBtn")
  .addEventListener(
    "click",
    start
  );

</script>
